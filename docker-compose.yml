services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nexora_laravel
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - nexora_mysql:/var/lib/mysql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:WzljKfE0a2ElBK5s6tZP/OTvnQ3wiSKxPG0EQXf3X/o=
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: nexora_laravel
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8080"

volumes:
  nexora_mysql:
